<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tài Chính - Ngô Bảo Lâm</title>
    <style>
        :root {
            --mau-nen-chinh: #f0f8ff;
            --mau-trang: #ffffff;
            --mau-xanh-dam: #0984e3;
            --mau-xanh-nhat: #74b9ff;
            --mau-chu-dam: #2d3436;
            --mau-chu-nhat: #636e72;
            --mau-vien: #dfe6e9;
            --mau-xanh-la: #00b894;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--mau-nen-chinh);
            color: var(--mau-chu-dam);
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .khung-chua {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--mau-trang);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(9, 132, 227, 0.1);
            animation: xuatHien 0.8s ease-out;
        }

        @keyframes xuatHien {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: var(--mau-xanh-dam);
            font-size: 32px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        h2 {
            color: var(--mau-chu-dam);
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--mau-xanh-nhat);
            padding-bottom: 10px;
            display: inline-block;
        }

        .khu-vuc-thong-ke {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: var(--mau-nen-chinh);
            border-radius: 12px;
            border: 1px dashed var(--mau-xanh-nhat);
        }

        .the-thong-ke { text-align: center; }
        .chu-thong-ke { font-size: 16px; color: var(--mau-chu-nhat); font-weight: bold; }
        .so-tien-tong { font-size: 36px; color: var(--mau-xanh-la); font-weight: bold; margin-top: 10px; }

        .khu-vuc-nhap-lieu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .khu-vuc-nhap-lieu { grid-template-columns: 1fr; }
        }

        .nhom-nhap-lieu { display: flex; flex-direction: column; }
        .nhom-nhap-lieu label { font-size: 14px; font-weight: bold; margin-bottom: 8px; }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--mau-vien);
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--mau-xanh-dam);
            box-shadow: 0 0 10px rgba(9, 132, 227, 0.2);
        }

        button {
            grid-column: 1 / -1;
            padding: 18px;
            background: linear-gradient(135deg, var(--mau-xanh-nhat), var(--mau-xanh-dam));
            color: var(--mau-trang);
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        hr { border: none; height: 2px; background-color: var(--mau-vien); margin: 40px 0; }

        .khu-vuc-bang { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--mau-trang);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        th { background-color: var(--mau-xanh-dam); color: var(--mau-trang); padding: 18px 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid var(--mau-vien); }
        tr:nth-child(even) { background-color: #f9fbfc; }
        tr:hover { background-color: var(--mau-nen-chinh); }
        .cot-tien { font-weight: bold; color: var(--mau-xanh-dam); }
    </style>
</head>
<body>

    <div class="khung-chua">
        <h1>Hệ Thống Quản Lý Chi Tiêu</h1>
        
        <div class="khu-vuc-thong-ke">
            <div class="the-thong-ke">
                <div class="chu-thong-ke">Tổng Tiền Đã Chi Tiêu</div>
                <div class="so-tien-tong" id="hienThiTongTien">0 đ</div>
            </div>
        </div>

        <form id="formNhapLieu">
            <div class="khu-vuc-nhap-lieu">
                <div class="nhom-nhap-lieu">
                    <label for="oNhapMssv">Mã số sinh viên</label>
                    <input type="text" id="oNhapMssv" placeholder="Ví dụ: 23010001" required>
                </div>
                <div class="nhom-nhap-lieu">
                    <label for="oNhapTen">Tên khoản chi</label>
                    <input type="text" id="oNhapTen" placeholder="Ví dụ: Mua sách..." required>
                </div>
                <div class="nhom-nhap-lieu">
                    <label for="oNhapTien">Số tiền (VNĐ)</label>
                    <input type="number" id="oNhapTien" placeholder="Nhập số tiền" min="0" required>
                </div>
                <div class="nhom-nhap-lieu">
                    <label for="oChonLoai">Danh mục chi phí</label>
                    <select id="oChonLoai">
                        <option value="Học tập">Học tập</option>
                        <option value="Ăn uống">Ăn uống</option>
                        <option value="Đi lại">Đi lại</option>
                        <option value="Giải trí">Giải trí</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>
                <button type="submit">Thêm Vào Danh Sách</button>
            </div>
        </form>

        <hr>

        <h2>Lịch Sử Giao Dịch</h2>
        <div class="khu-vuc-bang">
            <table>
                <thead>
                    <tr>
                        <th>Mã SV</th>
                        <th>Nội Dung</th>
                        <th>Số Tiền Chi</th>
                        <th>Phân Loại</th>
                    </tr>
                </thead>
                <tbody id="vungChuaDuLieu"></tbody>
            </table>
        </div>
    </div>

    <script>
        let tongTienChiTieu = 0;
        let theForm = document.getElementById('formNhapLieu');

        theForm.addEventListener('submit', function(suKien) {
            suKien.preventDefault();

            let giaTriMssv = document.getElementById('oNhapMssv').value.trim();
            let giaTriTen = document.getElementById('oNhapTen').value.trim();
            let giaTriTien = document.getElementById('oNhapTien').value.trim();
            let giaTriLoai = document.getElementById('oChonLoai').value;

            let soTienThuc = Number(giaTriTien);
            tongTienChiTieu += soTienThuc;

            let chuoiTienTongDep = tongTienChiTieu.toLocaleString('vi-VN');
            document.getElementById('hienThiTongTien').innerText = chuoiTienTongDep + ' đ';

            let chuoiTienDep = soTienThuc.toLocaleString('vi-VN') + ' đ';

            let maHtmlHangMoi = `
                <tr>
                    <td>${giaTriMssv}</td>
                    <td>${giaTriTen}</td>
                    <td class="cot-tien">${chuoiTienDep}</td>
                    <td>${giaTriLoai}</td>
                </tr>
            `;

            let theThanBang = document.getElementById('vungChuaDuLieu');
            let chuSoCuoiCung = giaTriMssv.slice(-1);
            let soCuoiCung = parseInt(chuSoCuoiCung, 10);
            
            if (!isNaN(soCuoiCung) && soCuoiCung % 2 !== 0) {
                theThanBang.insertAdjacentHTML('afterbegin', maHtmlHangMoi);
            } else {
                theThanBang.insertAdjacentHTML('beforeend', maHtmlHangMoi);
            }

            theForm.reset();
            document.getElementById('oNhapMssv').focus();
        });
    </script>
</body>
</html>
